openapi: 3.0.3
info:
  title: AI Documents Ingestion API
  description: |
    REST API for the AI Documents Ingestion multi-tenant system.
    Provides management of tenants, mailboxes, and ingested messages.

    ## Roles
    - `global_tenant_admin` — full access including tenant management
    - `tenant_admin` — mailbox management within own tenant
    - `tenant_user` — message access within own tenant

    ## Credential fields
    Fields marked `writeOnly` (tenant `attachment_store_secrets`; mailbox
    credential `credentials`; action `auth_credentials`) are accepted on
    write but never returned in any response.
  version: 0.16.0

servers:
  - url: localhost:8080/api/v1
    description: API v1

security:
  - BearerAuth: []

tags:
  - name: Tenants
    description: Tenant management — requires role `global_tenant_admin`
  - name: Mailboxes
    description: Mailbox management — requires role `tenant_admin` or `global_tenant_admin`
  - name: Messages
    description: Message access — requires role `tenant_user`
  - name: ConsumerStatus
    description: |
      Append-only audit log of how external systems reported handling a
      message — requires role `mailbox_user`. See
      docs/specs/external-message-consumers-api.md.
  - name: Addresses
    description: Tenant address management — requires role `tenant_admin` or `global_tenant_admin`
  - name: MailboxCredentials
    description: Mailbox credentials (IMAP, Outlook, Gmail) — requires role `tenant_admin` or `global_tenant_admin`
  - name: Actions
    description: Postprocessing actions (e.g. webhook notifications) and their mailbox links — requires role `tenant_admin` or `global_tenant_admin`
  - name: Users
    description: Human user management — requires role `global_tenant_admin`
  - name: ServiceAccounts
    description: Service account management — requires role `global_tenant_admin`
  - name: Roles
    description: Role grant/revoke for users and service accounts — requires role `global_tenant_admin` or `tenant_admin`
  - name: IdentityProviders
    description: Tenant-level federated identity provider management — requires role `global_tenant_admin`
  - name: Discovery
    description: Public, unauthenticated client-configuration discovery — no secrets exposed

# ──────────────────────────────────────────────────────────────────────────────
# Paths
# ──────────────────────────────────────────────────────────────────────────────
paths:

  # ── Discovery ───────────────────────────────────────────────────────────────

  /.well-known/client-config:
    get:
      tags: [Discovery]
      operationId: getClientConfig
      summary: OIDC client configuration for external API consumers
      description: |
        Publishes the values an external consumer (e.g. the Odoo bridge) needs
        to obtain API access tokens: issuer, token endpoint, grant type,
        audience (Zitadel project ID) and the exact scope string. The scope is
        composed server-side from the configured audience — consumers must use
        it verbatim. Public by design: none of these values is a secret (the
        issuer is public, the project ID appears in every issued token).
        In local_jwt mode only auth_provider_type is returned.
      security: []
      responses:
        '200':
          description: Client configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfigResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Tenants ─────────────────────────────────────────────────────────────────

  /tenants:
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Create a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Tenants]
      operationId: listTenants
      summary: List tenants
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: active
          in: query
          schema:
            type: boolean
          description: Filter by active status
        - name: include_deleted
          in: query
          schema:
            type: boolean
            default: false
          description: When true, include soft-deleted tenants
      responses:
        '200':
          description: Paginated list of tenants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTenantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/self:
    get:
      tags: [Tenants]
      operationId: listOwnTenants
      summary: List master data of the caller's own tenants
      description: |
        Returns master data for every tenant the calling identity is bound to
        — currently always exactly one element, the caller's home tenant; the
        list form is future-proofing for multi-tenant grants. Accessible to
        tenant-bound roles (`mailbox_user`, `tenant_admin`) and
        `global_tenant_admin` (which receives its home tenant, the bootstrap
        tenant). Contains no operational data (token limits, attachment
        store, service window). Returns an empty list when the home tenant is
        soft-deleted or the tenant claim cannot be resolved.
      responses:
        '200':
          description: Master data of the caller's tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantMasterDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'

    get:
      tags: [Tenants]
      operationId: getTenant
      summary: Get tenant by ID
      responses:
        '200':
          description: Tenant found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Tenants]
      operationId: updateTenant
      summary: Update tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantUpdate'
      responses:
        '200':
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Tenants]
      operationId: deleteTenant
      summary: Soft-delete a tenant
      description: |
        Sets `deleted_at` on the tenant record. Data is retained.
        Use `DELETE /tenants/{tenantId}/purge` for permanent removal.
        Returns 409 if the tenant is already soft-deleted.
      responses:
        '204':
          description: Tenant soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tenant is already soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/purge:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'

    delete:
      tags: [Tenants]
      operationId: purgeTenant
      summary: Permanently purge a soft-deleted tenant
      description: |
        Irreversibly removes the tenant and all associated mailboxes and messages.
        The tenant must be soft-deleted first; returns 409 otherwise.
      responses:
        '204':
          description: Tenant permanently deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tenant has not been soft-deleted yet; call DELETE first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Mailboxes ────────────────────────────────────────────────────────────────

  /tenants/{tenantId}/mailboxes:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'

    post:
      tags: [Mailboxes]
      operationId: createMailbox
      summary: Create a mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailboxCreate'
      responses:
        '201':
          description: Mailbox created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Mailboxes]
      operationId: listMailboxes
      summary: List mailboxes for a tenant
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: active
          in: query
          schema:
            type: boolean
          description: Filter by active status
        - name: ingestor_type
          in: query
          schema:
            $ref: '#/components/schemas/IngestorType'
          description: Filter by ingestor type
        - name: include_deleted
          in: query
          schema:
            type: boolean
            default: false
          description: When true, include soft-deleted mailboxes in results
      responses:
        '200':
          description: Paginated list of mailboxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMailboxResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/mailboxes/{mailboxId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'

    get:
      tags: [Mailboxes]
      operationId: getMailbox
      summary: Get mailbox by ID
      responses:
        '200':
          description: Mailbox found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Mailboxes]
      operationId: updateMailbox
      summary: Update mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailboxUpdate'
      responses:
        '200':
          description: Mailbox updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Mailboxes]
      operationId: deleteMailbox
      summary: Soft-delete a mailbox
      description: |
        Sets `deleted_at` on the mailbox record. Data is retained.
        Use `DELETE …/purge` for permanent removal.
        Returns 409 if the mailbox is already soft-deleted.
      responses:
        '204':
          description: Mailbox soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Mailbox is already soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/mailboxes/{mailboxId}/purge:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'

    delete:
      tags: [Mailboxes]
      operationId: purgeMailbox
      summary: Permanently purge a soft-deleted mailbox
      description: |
        Irreversibly removes the mailbox and all associated messages.
        The mailbox must be soft-deleted first; returns 409 otherwise.
      responses:
        '204':
          description: Mailbox permanently deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Mailbox has not been soft-deleted yet; call DELETE first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/mailboxes/{mailboxId}/verify:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'

    post:
      tags: [Mailboxes]
      operationId: verifyMailboxAccess
      summary: Verify mailbox connectivity
      description: |
        Makes a lightweight request to the mailbox to verify that the
        configuration (credentials, address, tenant) is correct and that
        the mailbox is reachable. Sets `is_accessible` on the mailbox record
        based on the result. Returns 200 in both cases; inspect `accessible`
        in the response body to determine success.
      responses:
        '200':
          description: Verification result (accessible or not)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxVerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Messages ─────────────────────────────────────────────────────────────────

  /tenants/{tenantId}/mailboxes/{mailboxId}/messages:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'

    get:
      tags: [Messages]
      operationId: listMessages
      summary: List messages in a mailbox
      description: |
        Returns key properties only. `body_text` and full attachment details
        are excluded; use the single-message endpoint for complete detail.
        Soft-deleted messages are hidden unless `include_deleted=true`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PipelineStatus'
          description: Filter by pipeline status
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Return messages received at or after this timestamp (RFC 3339)
        - name: until
          in: query
          schema:
            type: string
            format: date-time
          description: Return messages received strictly before this timestamp (RFC 3339)
        - name: include_deleted
          in: query
          schema:
            type: boolean
            default: false
          description: When true, include soft-deleted messages in results
      responses:
        '200':
          description: Paginated list of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/mailboxes/{mailboxId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'
      - $ref: '#/components/parameters/MessageIdParam'

    get:
      tags: [Messages]
      operationId: getMessage
      summary: Get message by ID
      description: Returns full message detail including body text and attachment list.
      responses:
        '200':
          description: Message found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Messages]
      operationId: deleteMessage
      summary: Soft-delete a message
      description: |
        Sets `deleted_at` on the message record. Data is retained.
        Use `DELETE …/purge` for permanent removal.
        Returns 409 if the message is already soft-deleted.
      responses:
        '204':
          description: Message soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Message is already soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/mailboxes/{mailboxId}/messages/{messageId}/purge:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'
      - $ref: '#/components/parameters/MessageIdParam'

    delete:
      tags: [Messages]
      operationId: purgeMessage
      summary: Permanently purge a soft-deleted message
      description: |
        Irreversibly removes the message record and all associated attachments.
        The message must be soft-deleted first; returns 409 otherwise.
      responses:
        '204':
          description: Message permanently deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Message has not been soft-deleted yet; call DELETE first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/mailboxes/{mailboxId}/messages/{messageId}/reprocess:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'
      - $ref: '#/components/parameters/MessageIdParam'

    post:
      tags: [Messages]
      operationId: reprocessMessage
      summary: Re-run pipeline for a single message
      description: |
        Resets a terminal message (processed or invalid) to stored status and
        re-runs classification and parsing synchronously. Returns the updated
        Message object on success.
        Returns 409 if the message is in a transient status (in-flight); the
        response body contains the current message state.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reprocessing complete; body is the updated Message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Message is in-flight and cannot be reprocessed; body is the current message state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Attachments ──────────────────────────────────────────────────────────────

  /tenants/{tenantId}/mailboxes/{mailboxId}/messages/{messageId}/attachments:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'
      - $ref: '#/components/parameters/MessageIdParam'

    get:
      tags: [Messages]
      operationId: listMessageAttachments
      summary: List attachments for a message
      description: Returns all attachment metadata for the given message, ordered by position.
      responses:
        '200':
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/mailboxes/{mailboxId}/messages/{messageId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'
      - $ref: '#/components/parameters/MessageIdParam'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Database ID of the attachment

    get:
      tags: [Messages]
      operationId: getMessageAttachment
      summary: Get attachment metadata by ID
      responses:
        '200':
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/mailboxes/{mailboxId}/messages/{messageId}/thread:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'
      - $ref: '#/components/parameters/MessageIdParam'

    get:
      tags: [Messages]
      operationId: listMessageThread
      summary: List all messages of the thread this message belongs to
      description: >
        Returns every ingested message sharing the given message's thread_id,
        ordered by received_at ascending (thread root first). A standalone
        message yields a single-element list. Thread members may live in other
        mailboxes of the same tenant.
      responses:
        '200':
          description: Messages of the thread, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Parsed Documents ──────────────────────────────────────────────────────────

  /tenants/{tenantId}/mailboxes/{mailboxId}/messages/{messageId}/parsed-documents:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'
      - $ref: '#/components/parameters/MessageIdParam'

    get:
      tags: [Messages]
      operationId: listMessageParsedDocuments
      summary: List parsed documents for a message
      description: Returns all parsed document records for the given message.
      responses:
        '200':
          description: List of parsed documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParsedDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/mailboxes/{mailboxId}/messages/{messageId}/parsed-documents/{parsedDocumentId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'
      - $ref: '#/components/parameters/MessageIdParam'
      - name: parsedDocumentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Database ID of the parsed document

    get:
      tags: [Messages]
      operationId: getMessageParsedDocument
      summary: Get a parsed document by ID
      responses:
        '200':
          description: Parsed document record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Consumer Status ─────────────────────────────────────────────────────────────

  /tenants/{tenantId}/mailboxes/{mailboxId}/messages/{messageId}/consumer_status:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/MailboxIdParam'
      - $ref: '#/components/parameters/MessageIdParam'

    get:
      tags: [ConsumerStatus]
      operationId: listConsumerStatus
      summary: List consumer status entries for a message
      description: |
        Append-only audit log of how external systems reported handling this
        message, oldest first. There is no per-entry GET/PUT/DELETE — entries
        are never mutated after creation.
      responses:
        '200':
          description: List of consumer status entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsumerStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [ConsumerStatus]
      operationId: createConsumerStatus
      summary: Record a consumer status entry for a message
      description: |
        `consumer_name` and `consumer_type` are free text supplied by the
        client. `mailbox_id` and `created_by_user_id` are always derived
        server-side, never taken from the request.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerStatusCreate'
      responses:
        '201':
          description: Created consumer status entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Messages (simplified) ────────────────────────────────────────────────────────
  # Mirrors every operation in the tenant/mailbox-scoped Messages and
  # ConsumerStatus sections above, addressed by messageId alone. The caller
  # must still hold a grant for the message's actual tenant and mailbox —
  # these are resolved server-side (see MessageOwnership in
  # docs/plans/external-message-consumers-api.md), not taken from the path.
  # Response/request schemas are identical to their full-endpoint
  # counterparts; only the path and operationId differ.

  /messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageIdParam'

    get:
      tags: [Messages]
      operationId: getMessageSimplified
      summary: Get message by ID (simplified path)
      description: Returns full message detail including body text and attachment list.
      responses:
        '200':
          description: Message found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Messages]
      operationId: deleteMessageSimplified
      summary: Soft-delete a message (simplified path)
      description: |
        Sets `deleted_at` on the message record. Data is retained.
        Use `DELETE …/purge` for permanent removal.
        Returns 409 if the message is already soft-deleted.
      responses:
        '204':
          description: Message soft-deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Message is already soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}/purge:
    parameters:
      - $ref: '#/components/parameters/MessageIdParam'

    delete:
      tags: [Messages]
      operationId: purgeMessageSimplified
      summary: Permanently purge a soft-deleted message (simplified path)
      description: |
        Irreversibly removes the message record and all associated attachments.
        The message must be soft-deleted first; returns 409 otherwise.
      responses:
        '204':
          description: Message permanently deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Message has not been soft-deleted yet; call DELETE first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}/reprocess:
    parameters:
      - $ref: '#/components/parameters/MessageIdParam'

    post:
      tags: [Messages]
      operationId: reprocessMessageSimplified
      summary: Re-run pipeline for a single message (simplified path)
      description: |
        Resets a terminal message (processed or invalid) to stored status and
        re-runs classification and parsing synchronously. Returns the updated
        Message object on success.
        Returns 409 if the message is in a transient status (in-flight); the
        response body contains the current message state.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reprocessing complete; body is the updated Message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Message is in-flight and cannot be reprocessed; body is the current message state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}/attachments:
    parameters:
      - $ref: '#/components/parameters/MessageIdParam'

    get:
      tags: [Messages]
      operationId: listMessageAttachmentsSimplified
      summary: List attachments for a message (simplified path)
      description: Returns all attachment metadata for the given message, ordered by position.
      responses:
        '200':
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/MessageIdParam'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Database ID of the attachment

    get:
      tags: [Messages]
      operationId: getMessageAttachmentSimplified
      summary: Get attachment metadata by ID (simplified path)
      responses:
        '200':
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}/thread:
    parameters:
      - $ref: '#/components/parameters/MessageIdParam'

    get:
      tags: [Messages]
      operationId: listMessageThreadSimplified
      summary: List all messages of the thread this message belongs to (simplified path)
      description: >
        Returns every ingested message sharing the given message's thread_id,
        ordered by received_at ascending (thread root first). A standalone
        message yields a single-element list.
      responses:
        '200':
          description: Messages of the thread, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}/attachments/{attachmentId}/content:
    parameters:
      - $ref: '#/components/parameters/MessageIdParam'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Database ID of the attachment

    get:
      tags: [Messages]
      operationId: downloadMessageAttachmentSimplified
      summary: Download raw attachment bytes (simplified path)
      description: |
        Returns the original attachment binary as stored at ingest time.
        Content-Type is the attachment's stored MIME type
        (application/octet-stream when unknown). Returns 404 when the
        attachment has no stored content.
      responses:
        '200':
          description: Raw attachment bytes
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="<original filename>"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}/parsed-documents:
    parameters:
      - $ref: '#/components/parameters/MessageIdParam'

    get:
      tags: [Messages]
      operationId: listMessageParsedDocumentsSimplified
      summary: List parsed documents for a message (simplified path)
      description: Returns all parsed document records for the given message.
      responses:
        '200':
          description: List of parsed documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParsedDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}/parsed-documents/{parsedDocumentId}:
    parameters:
      - $ref: '#/components/parameters/MessageIdParam'
      - name: parsedDocumentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Database ID of the parsed document

    get:
      tags: [Messages]
      operationId: getMessageParsedDocumentSimplified
      summary: Get a parsed document by ID (simplified path)
      responses:
        '200':
          description: Parsed document record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /messages/{messageId}/consumer_status:
    parameters:
      - $ref: '#/components/parameters/MessageIdParam'

    get:
      tags: [ConsumerStatus]
      operationId: listConsumerStatusSimplified
      summary: List consumer status entries for a message (simplified path)
      description: |
        Append-only audit log of how external systems reported handling this
        message, oldest first. There is no per-entry GET/PUT/DELETE — entries
        are never mutated after creation.
      responses:
        '200':
          description: List of consumer status entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsumerStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [ConsumerStatus]
      operationId: createConsumerStatusSimplified
      summary: Record a consumer status entry for a message (simplified path)
      description: |
        `consumer_name` and `consumer_type` are free text supplied by the
        client. `mailbox_id` and `created_by_user_id` are always derived
        server-side, never taken from the request.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumerStatusCreate'
      responses:
        '201':
          description: Created consumer status entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumerStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/addresses:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
    post:
      tags: [Addresses]
      operationId: createAddress
      summary: Create an address for a tenant
      description: |
        Creates an address record for the tenant.
        Set `mailbox_id` to create a mailbox-specific override;
        omit it (or set to null) to create the global tenant address.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Addresses]
      operationId: listAddresses
      summary: List addresses for a tenant
      security:
        - BearerAuth: []
      parameters:
        - name: city
          in: query
          schema:
            type: string
        - name: postal_code
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAddressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - name: addressId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Addresses]
      operationId: getAddress
      summary: Get address by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Address record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Addresses]
      operationId: updateAddress
      summary: Replace an address record
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdate'
      responses:
        '200':
          description: Updated address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Addresses]
      operationId: deleteAddress
      summary: Delete an address record
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── MailboxCredentials ────────────────────────────────────────────────────────

  /tenants/{tenantId}/mailbox-credentials:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
    get:
      tags: [MailboxCredentials]
      operationId: listMailboxCredentials
      summary: List mailbox credentials for a tenant
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paged list of mailbox credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMailboxCredentialResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [MailboxCredentials]
      operationId: createMailboxCredential
      summary: Create a mailbox credential
      description: |
        Validates that the provided credentials are structurally correct for
        the given type before storing. The `credentials` object is encrypted
        at rest and never returned in any response.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailboxCredentialCreate'
      responses:
        '201':
          description: Created mailbox credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxCredentialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/mailbox-credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [MailboxCredentials]
      operationId: getMailboxCredential
      summary: Get a mailbox credential by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Mailbox credential record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxCredentialResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [MailboxCredentials]
      operationId: updateMailboxCredential
      summary: Update a mailbox credential
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailboxCredentialUpdate'
      responses:
        '200':
          description: Updated mailbox credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxCredentialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [MailboxCredentials]
      operationId: deleteMailboxCredential
      summary: Delete a mailbox credential
      description: |
        Permanently removes the credential. Fails with 409 if any active mailbox references it.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Actions ──────────────────────────────────────────────────────────────────

  /tenants/{tenantId}/actions:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
    get:
      tags: [Actions]
      operationId: listActions
      summary: List postprocessing actions for a tenant
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paged list of actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Actions]
      operationId: createAction
      summary: Create a postprocessing action
      description: |
        `auth_credentials` is encrypted at rest and never returned in any
        response. Omit `auth_method`/`auth_credentials` entirely if the
        webhook needs no authentication.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCreate'
      responses:
        '201':
          description: Created action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/actions/{actionId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - name: actionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Actions]
      operationId: getAction
      summary: Get a postprocessing action by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Action record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Actions]
      operationId: updateAction
      summary: Update a postprocessing action
      description: |
        All fields are optional; only provided fields are changed. Omitting
        `auth_method` entirely preserves the existing credentials; sending
        `auth_method: ""` clears them; sending any other `auth_method` value
        together with `auth_credentials` replaces them.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionUpdate'
      responses:
        '200':
          description: Updated action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Actions]
      operationId: deleteAction
      summary: Delete a postprocessing action
      description: |
        Permanently removes the action and its mailbox links. Any
        not-yet-delivered webhook_outbox entries for this action are
        cascade-deleted along with it.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/actions/{actionId}/validate:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - name: actionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Actions]
      operationId: validateAction
      summary: Formally validate an action and run a live test call
      description: |
        Two-step, synchronous, single-attempt process: (1) formal validation
        of the stored URL; (2) if that passes, a live test request — the same
        wire format as a real webhook delivery (a bare JSON array), but empty
        (`[]`) and with `mode=test` merged into the query string so the
        receiver can distinguish it from a real delivery. Uses the same
        per-request timeout as production dispatch. Steps short-circuit: if
        formal validation fails, the live call is never attempted.

        On success, `validated` is set to `true` on the action, which is a
        prerequisite for `active: true` (see ActionCreate/ActionUpdate). On
        failure, `validated` is set to `false`. Always returns `200` when
        auth/authz/not-found pass — inspect `success` in the body to
        determine the outcome, mirroring `POST .../mailboxes/{mailboxId}/verify`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Validation result (of either step)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionValidateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/actions/{actionId}/mailboxes:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - name: actionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Actions]
      operationId: listActionMailboxes
      summary: List mailboxes linked to an action
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Linked mailbox IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionMailboxList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Actions]
      operationId: linkActionMailbox
      summary: Link a mailbox to an action
      description: |
        Idempotent: linking an already-linked mailbox is a no-op. The
        mailbox must belong to the same tenant as the action.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionMailboxLink'
      responses:
        '204':
          description: Linked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/actions/{actionId}/mailboxes/{mailboxId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - name: actionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/MailboxIdParam'
    delete:
      tags: [Actions]
      operationId: unlinkActionMailbox
      summary: Unlink a mailbox from an action
      description: Removing a non-existent link is a no-op.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Unlinked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

# ──────────────────────────────────────────────────────────────────────────────
# Components
# ──────────────────────────────────────────────────────────────────────────────
  # ── Users ────────────────────────────────────────────────────────────────────

  /tenants/{tenantId}/users:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
    get:
      tags: [Users]
      operationId: listTenantUsers
      summary: List a tenant's human users
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Users]
      operationId: createTenantUser
      summary: Create a human user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/UserIdParam'
    get:
      tags: [Users]
      operationId: getTenantUser
      summary: Get a human user by ID
      description: |
        Returns every field Zitadel exposes for this user (profile, contact
        details, verification status) alongside the local active flag and
        tenant-scoped role state.
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Users]
      operationId: updateTenantUser
      summary: Update a human user
      description: |
        All fields are optional; only provided fields are changed.
        Setting `active` to false deactivates the user in Zitadel, revokes its
        `email-bridge` login-gate grant, and marks it inactive locally — this
        is the only supported way to remove a human user (no hard delete).
        Setting `active` back to true reverses all three.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── Roles ────────────────────────────────────────────────────────────────────

  /users/{userId}/roles:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
    post:
      tags: [Roles]
      operationId: assignUserRole
      summary: Grant a role to a user or service account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleGrant'
      responses:
        '204':
          description: Role granted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Roles]
      operationId: revokeUserRole
      summary: Revoke a role from a user or service account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleGrant'
      responses:
        '204':
          description: Role revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── ServiceAccounts ──────────────────────────────────────────────────────────

  /tenants/{tenantId}/service-accounts:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
    get:
      tags: [ServiceAccounts]
      operationId: listServiceAccounts
      summary: List a tenant's service accounts
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated list of service accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedServiceAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [ServiceAccounts]
      operationId: createServiceAccount
      summary: Create a service account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountCreate'
      responses:
        '201':
          description: Service account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/service-accounts/{userId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/UserIdParam'
    get:
      tags: [ServiceAccounts]
      operationId: getServiceAccount
      summary: Get a service account by ID
      responses:
        '200':
          description: Service account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [ServiceAccounts]
      operationId: updateServiceAccount
      summary: Update a service account
      description: All fields are optional; only provided fields are changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountUpdate'
      responses:
        '200':
          description: Service account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [ServiceAccounts]
      operationId: deleteServiceAccount
      summary: Delete a service account
      description: |
        Hard delete — unlike a human user, a service account has no
        deactivate-only mode. Removes the Zitadel machine user and its local
        row.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/service-accounts/{userId}/keys:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/UserIdParam'
    post:
      tags: [ServiceAccounts]
      operationId: createServiceAccountKey
      summary: Mint a new JWT-profile key for a service account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAccountKeyCreate'
      responses:
        '201':
          description: Key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/service-accounts/{userId}/keys/{keyId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/UserIdParam'
      - $ref: '#/components/parameters/KeyIdParam'
    delete:
      tags: [ServiceAccounts]
      operationId: deleteServiceAccountKey
      summary: Revoke a service account's machine key
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/service-accounts/{userId}/pats:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/UserIdParam'
    get:
      tags: [ServiceAccounts]
      operationId: listServiceAccountPats
      summary: List a service account's personal access tokens
      responses:
        '200':
          description: List of personal access tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPersonalAccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [ServiceAccounts]
      operationId: createServiceAccountPat
      summary: Issue a new personal access token for a service account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalAccessTokenCreate'
      responses:
        '201':
          description: Personal access token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAccessTokenCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /tenants/{tenantId}/service-accounts/{userId}/pats/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/TenantIdParam'
      - $ref: '#/components/parameters/UserIdParam'
      - $ref: '#/components/parameters/TokenIdParam'
    delete:
      tags: [ServiceAccounts]
      operationId: deleteServiceAccountPat
      summary: Revoke a service account's personal access token
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ── IdentityProviders ────────────────────────────────────────────────────────

  /tenants/{tenantId}/idp-providers:
