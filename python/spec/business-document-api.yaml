      - $ref: '#/components/parameters/TenantIdParam'
    get:
      tags: [IdentityProviders]
      operationId: listIdpProviders
      summary: List a tenant's federated identity providers
      responses:
        '200':
          description: List of identity providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedIdpProviderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
