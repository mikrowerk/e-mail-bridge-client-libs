      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdpProviderCreate'
      responses:
        '201':
          description: Identity provider attached
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by the authentication service.
        The `roles` claim must contain at least one of:
        `global_tenant_admin`, `tenant_admin`, `tenant_user`.

  # ── Reusable Parameters ──────────────────────────────────────────────────────
  parameters:
    TenantIdParam:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID7 tenant identifier

    MailboxIdParam:
      name: mailboxId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID7 mailbox identifier

    MessageIdParam:
      name: messageId
      in: path
      required: true
      schema:
        type: string
      description: Provider-native message identifier (e.g. IMAP UID, Gmail message ID)

    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID identifier of a user (human or service account)

    KeyIdParam:
      name: keyId
      in: path
      required: true
      schema:
        type: string
      description: Zitadel machine key identifier

    TokenIdParam:
      name: tokenId
      in: path
      required: true
      schema:
        type: string
      description: Personal access token identifier

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based)

    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page (max 100)

  # ── Reusable Responses ───────────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated user lacks the required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # ── Schemas ──────────────────────────────────────────────────────────────────
  schemas:

    # ── Discovery ───────────────────────────────────────────────────────────────

    ClientConfigResponse:
      type: object
      description: >
        Client configuration for external API consumers. All OIDC fields are
        absent when auth_provider_type is "local_jwt".
      required: [auth_provider_type]
      properties:
        auth_provider_type:
          type: string
          enum: [remote, local_jwt]
          description: Token validation mode of this server.
        issuer:
          type: string
          description: OIDC issuer base URL (Zitadel).
        token_endpoint:
          type: string
          description: OAuth2 token endpoint (issuer + /oauth/v2/token).
        grant_type:
          type: string
          description: Grant type for service accounts (JWT bearer profile).
        audience:
          type: string
          description: Zitadel project ID expected in the token's aud claim.
        scope:
          type: string
          description: >
            Exact scope string to request — composed server-side, use
            verbatim.

    # ── Common ──────────────────────────────────────────────────────────────────

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g. TENANT_NOT_FOUND, INVALID_INPUT)
        message:
          type: string
          description: Human-readable error description
        details:
          type: object
          additionalProperties: true
          description: Optional additional context (field errors, trace IDs, etc.)

    PaginationMeta:
      type: object
      required: [total, page, page_size]
      properties:
        total:
          type: integer
          description: Total number of matching records
        page:
          type: integer
          description: Current page number (1-based)
        page_size:
          type: integer
          description: Number of items returned in this page

    # ── Enumerations ─────────────────────────────────────────────────────────────

    IngestorType:
      type: string
      enum: [imap, pop3, gmail, outlook]
      description: Email source adapter type

    PipelineStatus:
      type: string
      enum: [stored, classified, llm_parsed, parsed, processed, invalid]
      description: |
        Current pipeline processing stage of a message.
        Statuses advance forward only: stored → classified → llm_parsed → parsed → processed.
        `invalid` is a terminal dead-letter status.

    DocumentType:
      type: string
      enum:
        - invoice
        - order
        - delivery
        - inquiry
        - request-for-quotation
        - order-confirmation
        - payment-announcement
        - payment-reminder
        - work
        - legal
        - accounting
        - information
        - spam
        - image
        - unknown
      description: Business classification of an ingested document

    # ── Tenant ───────────────────────────────────────────────────────────────────

    TenantCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Display name of the tenant
        active:
          type: boolean
          default: true
          description: Whether the ingestor service is allowed to run for this tenant
        service_start:
          type: string
          format: date-time
          description: Earliest time the scan service may run for this tenant (RFC 3339)
        service_end:
          type: string
          format: date-time
          nullable: true
          description: Service expiry time. Null means the service runs indefinitely.
        max_tokens_per_period:
          type: integer
          format: int64
          nullable: true
          description: LLM token usage cap per billing period. Null means unlimited.
        token_alert_threshold:
          type: integer
          format: int64
          nullable: true
          description: Alert when cumulative token usage crosses this value. Null means no alert.
        attachment_store_type:
          type: string
          enum: [local, s3, gcs, azure]
          default: local
          description: Storage backend for attachments
        attachment_store_params:
          type: object
          additionalProperties:
            type: string
          description: Non-secret backend configuration (e.g. bucket name, region, path)
        attachment_store_secrets:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Secret backend configuration (e.g. access keys). Write-only — never returned.

    TenantUpdate:
      type: object
      description: All fields are optional; only provided fields are updated.
      properties:
        name:
          type: string
        active:
          type: boolean
        service_start:
          type: string
          format: date-time
        service_end:
          type: string
          format: date-time
          nullable: true
        max_tokens_per_period:
          type: integer
          format: int64
          nullable: true
        token_alert_threshold:
          type: integer
          format: int64
          nullable: true
        attachment_store_type:
          type: string
          enum: [local, s3, gcs, azure]
        attachment_store_params:
          type: object
          additionalProperties:
            type: string
        attachment_store_secrets:
          type: object
          additionalProperties:
            type: string
          writeOnly: true
          description: Secret backend configuration. Write-only — never returned.

    TenantResponse:
      type: object
      required: [id, name, active, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: UUID7 tenant identifier
        name:
          type: string
        active:
          type: boolean
        service_start:
          type: string
          format: date-time
          nullable: true
        service_end:
          type: string
          format: date-time
          nullable: true
        max_tokens_per_period:
          type: integer
          format: int64
          nullable: true
        token_alert_threshold:
          type: integer
          format: int64
          nullable: true
        attachment_store_type:
          type: string
          enum: [local, s3, gcs, azure]
        attachment_store_params:
          type: object
          additionalProperties:
            type: string
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the tenant has been soft-deleted. Null means not deleted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PagedTenantResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TenantResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    TenantMasterDataResponse:
      type: object
      description: |
        Consumer-facing tenant master data (GET /tenants/self): identity plus
        the global address record — no operational data.
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
          description: UUID7 tenant identifier
        name:
          type: string
        active:
          type: boolean
        address:
          nullable: true
          description: |
            The tenant's global address record (master data for matching
            against an external business system). Null when no global address
            is maintained. Mailbox-specific overrides are never returned.
          allOf:
            - $ref: '#/components/schemas/AddressResponse'

    # ── Mailbox ───────────────────────────────────────────────────────────────────

    MailboxCreate:
      type: object
      required: [ingestor_type, display_name, email_address]
      properties:
        ingestor_type:
          $ref: '#/components/schemas/IngestorType'
        display_name:
          type: string
          description: Human-readable label for this mailbox
        active:
          type: boolean
          default: true
          description: Whether this mailbox is included in polling cycles
        email_address:
          type: string
          format: email
          description: Email address to poll
        credential_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the GenericMailboxCredential to use for authentication
        folders_to_scan:
          type: array
          items:
            type: string
          description: IMAP folder names to poll (e.g. ["INBOX", "Documents"])
        root_folder_prefix:
          type: string
          description: Optional prefix applied to all folder names
        poll_interval_seconds:
          type: integer
          default: 300
          description: Polling interval in seconds
        max_messages:
          type: integer
          default: 0
          description: Maximum messages fetched per poll cycle. 0 means unlimited.
        since_time:
          type: string
          format: date-time
          description: Initial lower bound for server-side date filtering (RFC 3339)
        until_time:
          type: string
          format: date-time
          description: Optional upper bound for server-side date filtering (RFC 3339). Emails received at or after this time are excluded.
        poll_timeout_seconds:
          type: integer
          default: 60
          description: Hard deadline for a single poll cycle in seconds

    MailboxUpdate:
      type: object
      description: All fields are optional; only provided fields are updated.
      properties:
        display_name:
          type: string
        active:
          type: boolean
        credential_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the GenericMailboxCredential to use for authentication
        folders_to_scan:
          type: array
          items:
            type: string
        root_folder_prefix:
          type: string
        poll_interval_seconds:
          type: integer
        max_messages:
          type: integer
        since_time:
          type: string
          format: date-time
        until_time:
          type: string
          format: date-time
        poll_timeout_seconds:
          type: integer

    MailboxResponse:
      type: object
      required: [id, tenant_id, ingestor_type, display_name, active, email_address, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: UUID7 mailbox identifier
        tenant_id:
          type: string
          format: uuid
        ingestor_type:
          $ref: '#/components/schemas/IngestorType'
        display_name:
          type: string
        active:
          type: boolean
        email_address:
          type: string
          format: email
        credential_id:
          type: string
          format: uuid
          nullable: true
          description: ID of the GenericMailboxCredential used for authentication
        folders_to_scan:
          type: array
          items:
            type: string
        root_folder_prefix:
          type: string
        poll_interval_seconds:
          type: integer
        max_messages:
          type: integer
        since_time:
          type: string
          format: date-time
          nullable: true
        until_time:
          type: string
          format: date-time
          nullable: true
        last_processed_message_id:
          type: string
          nullable: true
          description: Provider-native ID of the last successfully processed message
        last_processed_at:
          type: string
          format: date-time
          nullable: true
        poll_timeout_seconds:
          type: integer
        is_accessible:
          type: boolean
          readOnly: true
          description: |
            True when the last verify call succeeded; false by default until
            verified. The scanner skips mailboxes where this is false.
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the mailbox has been soft-deleted. Null means not deleted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MailboxVerifyResponse:
      type: object
      required: [accessible]
      properties:
        accessible:
          type: boolean
          description: True if the mailbox is reachable and correctly configured.
        reason:
          type: string
          nullable: true
          description: Human-readable reason when accessible is false.

    PagedMailboxResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MailboxResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Message ───────────────────────────────────────────────────────────────────

    ClassificationEntry:
      type: object
      required: [part, confidence, document_type]
      properties:
        part:
          type: integer
          description: Attachment index (-1 = email body).
        name:
          type: string
          description: Attachment filename, or 'body' for the email body.
        confidence:
          type: number
          format: double
          description: Classification confidence score [0, 1].
        document_type:
          type: string
          description: Classified document type.
        summary:
          type: string
          description: One-sentence description of this document part.

    AttachmentSummary:
      type: object
      required: [filename, mime_type]
      properties:
        filename:
          type: string
        mime_type:
          type: string
        content_disposition:
          type: string
          description: Value of the Content-Disposition header (e.g. "attachment", "inline")
        storage_key:
          type: string
          description: |
            Storage URI set after the attachment has been persisted
            (e.g. "local://msg123/invoice.pdf", "s3://bucket/msg123/invoice.pdf").
            Empty if not yet stored.

    MessageResponse:
      type: object
      description: |
        Abbreviated message record returned in list responses.
        `body_text`, CC recipients, and full attachment details are excluded.
      required: [id, tenant_id, mailbox_id, source, received_at, from, subject, pipeline_status]
      properties:
        id:
          type: string
          format: uuid
          description: Internal UUID-7 primary key assigned at persistence time
        external_msg_id:
          type: string
          description: Provider-native message identifier (e.g. IMAP UID hash, Gmail message ID). Used for deduplication.
        tenant_id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
        source:
          type: string
          description: Ingestor adapter that produced this message (imap, gmail, outlook)
        received_at:
          type: string
          format: date-time
        from:
          type: string
          description: Sender address
        to:
          type: array
          items:
            type: string
          description: Primary recipient addresses
        subject:
          type: string
        pipeline_status:
          $ref: '#/components/schemas/PipelineStatus'
        is_forwarded:
          type: boolean
          description: True when the message was identified as a forwarded email
        original_from:
          type: string
          nullable: true
          description: Original sender when the message is a forwarded email
        attachment_count:
          type: integer
          description: Number of attachments
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the message has been soft-deleted. Null means not deleted.
        classifications:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationEntry'
          description: Per-part classification entries (email body and each parsed attachment).
        is_thread:
          type: boolean
          description: >
            True when the message belongs to an email thread with more than one
            ingested member, or when the subject+participant heuristic flagged
            it as a likely reply.
        thread_id:
          type: string
          format: uuid
          description: >
            Conversation grouping identifier. Equals the id of the thread's
            root message; a standalone message is a thread of size 1
            (thread_id == id). All messages of one conversation share this
            value — list them via GET /messages/{messageId}/thread.

    MessageDetailResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          description: Full message detail including body text, HTML body, attachment list, and stage result.
          properties:
            cc:
              type: array
              items:
                type: string
              description: CC recipient addresses
            body_text:
              type: string
              description: Plain-text message body
            body_html:
              type: string
              description: HTML message body
            original_to:
              type: string
              nullable: true
              description: Original primary recipient when the message is a forwarded email
            forwarders:
              type: string
              nullable: true
              description: Comma-separated forwarder addresses, most-recent forwarder first
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/AttachmentSummary'
            stage_result:
              $ref: '#/components/schemas/MessageStageResult'
            message_id_hdr:
              type: string
              description: >
                RFC 5322 Message-ID of this message, without angle brackets.
                Together with in_reply_to and references this lets external
                systems correlate the message against their own mail archive
                or run their own threading (JWZ / JMAP style).
            in_reply_to:
              type: string
              description: >
                Message-ID of the direct parent (first token of the
                In-Reply-To header), without angle brackets. Empty for
                non-replies.
            references:
              type: array
              items:
                type: string
              description: >
                Message-ID tokens of the References header in original order
                (oldest ancestor first), without angle brackets.
            provider_thread_id:
              type: string
              description: >
                Mail provider's native conversation identifier (Gmail
                threadId, Microsoft Graph conversationId). Empty for IMAP
                sources.
            parent_id:
              type: string
              format: uuid
              nullable: true
              description: >
                Internal id of the direct parent message when the
                In-Reply-To/References chain matched an ingested message.
                Null otherwise.

    PagedMessageResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Stage Result ──────────────────────────────────────────────────────────────

    StageMetadataInfo:
      type: object
      description: Processing provenance for a single pipeline stage.
      properties:
        parser:
          type: string
          description: Identifier of the component that produced this result
        completed_at:
          type: string
          format: date-time
          nullable: true
        duration_seconds:
          type: number
          format: double
        llm_model_name:
          type: string
          nullable: true
        llm_input_tokens:
          type: integer
          format: int64
          nullable: true
        llm_output_tokens:
          type: integer
          format: int64
          nullable: true
        llm_inference_time_ms:
          type: integer
          format: int64
          nullable: true

    StageResultClassification:
      type: object
      description: Classification result section of the pipeline stage result.
      properties:
        document_types:
          type: array
          items:
            type: string
          description: Document types detected in the message
        contact_type:
          type: string
          description: Business relationship of the sender
        confidence:
          type: number
          format: double
        short_summary:
          type: string
          description: One-sentence LLM summary of the message
        stage_metadata:
          $ref: '#/components/schemas/StageMetadataInfo'

    StageResultDocument:
      type: object
      description: >-
        Parsed document summary within the stage result. Entries with
        `deduplicated_by_index` set are placeholders for attachments that were
        skipped because a canonical duplicate (typically an XML equivalent of
        a PDF) was parsed instead; they carry no document payload fields and
        must not be imported as documents. An absent `deduplicated_by_index`
        means the entry is not a duplicate.
      properties:
        attachment_id:
          type: integer
          format: int64
          description: Database ID of the source attachment (FK to attachments table)
        attachment_name:
          type: string
        deduplicated_by_index:
          type: integer
          description: >-
            Zero-based position of the canonical attachment this one was
            deduplicated by. Only present when the attachment was skipped as
            a duplicate — an absent value means not deduplicated.
        deduplicated_by_name:
          type: string
          description: >-
            Filename of the canonical attachment. Only present when
            deduplicated_by_index is set.
        deduplicated_by_attachment_id:
          type: integer
          format: int64
          description: >-
            Database ID of the canonical attachment (FK to attachments
            table). Only present when deduplicated_by_index is set.
        document_type_code:
          type: string
          description: UN/CEFACT UNCL 1001 code (e.g. "380" for Invoice)
        document_type_name:
          type: string
          description: Human-readable document type label
        document_date:
          type: string
          format: date
          nullable: true
        document_number:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
          description: One-sentence LLM-generated description of the document
        stage_metadata:
          $ref: '#/components/schemas/StageMetadataInfo'

    MessageStageResult:
      type: object
      description: Streamlined pipeline processing result returned alongside a message detail.
      properties:
        classification:
          $ref: '#/components/schemas/StageResultClassification'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/StageResultDocument'

    # ── Attachment ────────────────────────────────────────────────────────────────

    AttachmentResponse:
      type: object
      required: [id, message_id, position, filename, mime_type]
      description: Full attachment metadata record.
      properties:
        id:
          type: integer
          format: int64
          description: Database-assigned attachment ID
        message_id:
          type: string
          description: ID of the parent message
        position:
          type: integer
          description: Zero-based position index within the message
        filename:
          type: string
        mime_type:
          type: string
        content_disposition:
          type: string
          nullable: true
        storage_key:
          type: string
          nullable: true
          description: |
            Storage URI (e.g. "local://msg123/invoice.pdf", "s3://bucket/key").
            Empty if not yet stored.

    # ── Parsed Document ───────────────────────────────────────────────────────────

    ParsedDocumentResponse:
      type: object
      required: [id, message_id, attachment_index, document_type, data_type, is_fully_parsed, created_at]
      description: Parsed document record from the parsed_documents table.
      properties:
        id:
          type: integer
          format: int64
        message_id:
          type: string
        attachment_index:
          type: integer
          description: Zero-based index of the source attachment (-1 for body)
        attachment_name:
          type: string
        document_type:
          type: string
          description: Classified document type (e.g. "invoice", "order")
        data_type:
          type: string
          description: How the data field is encoded ("json" or "binary")
        data:
          description: |
            Parsed document payload. For `data_type` "json" this is always the
            canonical BusinessDocument schema — XML parse results (CII, UBL,
            ZUGFeRD) are stored in that shape, LLM parse results are mapped to
            it at serve time. Check `document_source` inside the payload for
            provenance: `llm-pdf` / `llm-body` documents are best-effort
            extractions; importing systems must apply their own validation and
            taxation logic. For `data_type` "binary" the payload is absent.
            Schema: see `#/components/schemas/BusinessDocument`.
        stage_parser:
          type: string
        stage_completed_at:
          type: string
          format: date-time
          nullable: true
        stage_duration_s:
          type: number
          format: double
        llm_model_name:
          type: string
          nullable: true
        llm_input_tokens:
          type: integer
          format: int64
          nullable: true
        llm_output_tokens:
          type: integer
          format: int64
          nullable: true
        llm_inference_time_ms:
          type: integer
          format: int64
          nullable: true
        is_fully_parsed:
          type: boolean
        deduplicated_by_index:
          type: integer
          description: >-
            Zero-based position of the canonical attachment this record was
            deduplicated by. Only present when the attachment was skipped as
            a duplicate — an absent value means not deduplicated. Replaces
            the former is_deduplicated_by boolean (removed in 0.15.0).
        deduplicated_by_name:
          type: string
          description: >-
            Filename of the canonical attachment. Only present when
            deduplicated_by_index is set.
        created_at:
          type: string
          format: date-time

    # ── Consumer Status ───────────────────────────────────────────────────────────
    # See docs/specs/external-message-consumers-api.md. Append-only audit log —
    # no update/delete schemas exist since entries are never mutated.

    ConsumerStatusValue:
      type: string
      enum: [imported, failed, skipped, related]
      description: >-
        Outcome an external consumer reports for a message. `related` means the
        message was matched to an existing record in the external system rather
        than imported as a new one.

    BacklinkStatus:
      type: string
      enum: [imported, related]
      description: Whether the linked external record was created by the import or already existed.

    ConsumerStatusBacklink:
      type: object
      required: [url, status]
      properties:
        url:
          type: string
          minLength: 1
          description: Hyperlink to the record in the external system.
        title:
          type: string
          description: Optional human-readable link label.
        status:
          $ref: '#/components/schemas/BacklinkStatus'

    ConsumerStatusCreate:
      type: object
      required: [consumer_name, consumer_type, status]
      properties:
        consumer_name:
          type: string
          description: Free-text identifier of the reporting consumer instance, supplied by the client.
        consumer_type:
          type: string
          description: Free-text category of the reporting consumer, supplied by the client (e.g. "odoo-email-bridge").
        status:
          $ref: '#/components/schemas/ConsumerStatusValue'
        backlinks:
          type: array
          description: Optional hyperlinks to the imported or related records in the external system.
          items:
            $ref: '#/components/schemas/ConsumerStatusBacklink'

    ConsumerStatusResponse:
      type: object
      required: [id, tenant_id, message_id, mailbox_id, consumer_name, consumer_type, status, backlinks, created_by_user_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        message_id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
          description: The message's mailbox, resolved server-side — always in sync with the referenced message.
        consumer_name:
          type: string
        consumer_type:
          type: string
        status:
          $ref: '#/components/schemas/ConsumerStatusValue'
        backlinks:
          type: array
          description: Hyperlinks to the imported or related records in the external system; empty when none were reported.
          items:
            $ref: '#/components/schemas/ConsumerStatusBacklink'
        created_by_user_id:
          type: string
          format: uuid
          description: Local user UUID of the authenticated caller that wrote this entry.
        created_at:
          type: string
          format: date-time

    # ── Business Document ─────────────────────────────────────────────────────────
    # Field names aligned with domain.Document (internal Go struct).

    Document:
      type: object
      deprecated: true
      description: |
        DEPRECATED — replaced by the BusinessDocument schema. Since v0.13.0
        the `data` payload of parsed-document responses is always the
        canonical BusinessDocument shape; LLM parse results are mapped to it
        at serve time. This schema remains only to describe historic payloads.
      properties:
        document_type_name:
          type: string
          description: Human-readable document type label (e.g. "Commercial Invoice")
        document_type_code:
          type: string
          description: UN/CEFACT UNCL 1001 code (e.g. "380" for Invoice, "381" for Credit Note)
        document_number:
          type: string
          description: Document / invoice number
        reference:
          type: string
          description: Buyer order number or cross-reference carried on the document
        project:
          type: string
          description: Project reference
        document_date:
          type: string
          format: date
          description: Document issue date
        due_date:
          type: string
          format: date
          nullable: true
          description: Payment due date. Absent if not explicitly stated.
        note:
          type: string
          description: Free-text note
        sender:
          $ref: '#/components/schemas/Party'
        recipient:
          $ref: '#/components/schemas/Party'
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
        totals:
          $ref: '#/components/schemas/Totals'
        payment_terms:
          type: string
        payment_method:
          type: string
        paid:
          type: boolean
          description: True when the document has already been paid
        bank_accounts:
          type: array
          items:
            $ref: '#/components/schemas/BankAccount'
        additional_info:
          type: string
        summary:
          type: string
          description: One-sentence LLM-generated description of the document
        document_language:
          type: string
          description: ISO 639-1 language code of the document (e.g. "de", "en")

    Party:
      type: object
      description: A business entity — either the sender or the recipient of a document.
      properties:
        name:
          type: string
          description: Full formal name of the party
        street:
          type: string
        postal_code:
          type: string
        city:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code (e.g. "DE")
        vat_id:
          type: string
          description: VAT registration number (e.g. "DE123456789")
        tax_id:
          type: string
          description: Local tax number (e.g. "12/345/67890")
        email:
          type: string
          format: email
        phone:
          type: string

    LineItem:
      type: object
      description: A single position on a document.
      properties:
        position:
          type: integer
          description: Line position number (1-based)
        description:
          type: string
        quantity:
          type: string
          description: Quantity as a decimal string (preserves precision)
        unit:
          type: string
          description: Unit of measure (e.g. "pcs", "h", "kg")
        unit_price:
          type: string
          description: Net unit price after discounts (decimal string)
        discount:
          type: string
          description: Absolute discount amount applied to this line (decimal string)
        net_amount:
          type: string
          description: Line net amount — quantity × net unit price (decimal string)
        gross_amount:
          type: string
          description: Line gross amount including tax (decimal string)
        tax_rate:
          type: string
          description: VAT rate as percentage (e.g. "19.00")
        tax_amount:
          type: string
          description: VAT amount for this line (decimal string)

    Totals:
      type: object
      description: Aggregated monetary values for a document.
      properties:
        net_amount:
          type: string
          description: Sum of all line net amounts (decimal string)
        discount:
          type: string
          description: Total document-level discount (decimal string)
        taxes:
          type: array
          items:
            $ref: '#/components/schemas/TaxEntry'
          description: Tax breakdown by rate
        total_tax:
          type: string
          description: Total tax amount across all rates (decimal string)
        gross_amount:
          type: string
          description: Total gross amount including all taxes (decimal string)
        open_amount:
          type: string
          description: Outstanding amount (gross minus any prepayments) (decimal string)
        currency:
          type: string
          description: ISO 4217 currency code (e.g. "EUR", "USD")

    TaxEntry:
      type: object
      description: One tax-rate bucket and its computed amount within Totals.
      properties:
        tax_rate:
          type: string
          description: Tax rate as percentage (decimal string, e.g. "19.00")
        tax_amount:
          type: string
          description: Tax amount for this rate bucket (decimal string)

    BankAccount:
      type: object
      description: Payment routing information.
      properties:
        iban:
          type: string
          description: IBAN of the payee account
        bic:
          type: string
          description: BIC/SWIFT code
        bank_name:
          type: string
          description: Name of the financial institution

    # ── BusinessDocument (canonical export schema, EN 16931) ─────────────────────

    DocumentSource:
      type: string
      enum: [xml-cii, xml-ubl, xml-zugferd, llm-pdf, llm-body]
      description: |
        Provenance of a BusinessDocument. `xml-*` sources are faithful
        EN 16931 representations parsed from structured XML and legally
        reliable. `llm-*` sources are best-effort LLM extractions from
        unstructured content (PDF or e-mail body) — they may be incomplete or
        violate EN 16931 business rules; importing systems must apply their
        own validation and taxation logic.

    BusinessDocument:
      type: object
      description: |
        Canonical parsed business document based on EN 16931
        (XRechnung / ZUGFeRD / Factur-X). Single export schema for all parse
        results since v0.13.0. All monetary amounts and quantities are decimal
        values encoded as JSON strings (e.g. "1428.00") to avoid float
        precision loss.
      properties:
        document_source:
          $ref: '#/components/schemas/DocumentSource'
        document_type_name:
          type: string
          description: Human-readable document type label (e.g. "Commercial Invoice")
        document_type_code:
          type: string
          description: UN/CEFACT UNCL 1001 code (e.g. "380" for Invoice)
        id:
          type: string
          description: Document / invoice number
        buyer_reference:
          type: string
          description: Buyer-assigned reference (e.g. Leitweg-ID on XRechnung)
        project_reference:
          type: string
        contract_reference:
          type: string
        issue_date:
          type: string
          format: date-time
        due_date:
          type: string
          format: date-time
          nullable: true
          description: Payment due date. Absent if not explicitly stated.
        note:
          type: string
          description: Free-text note. For LLM sources any additional info is appended after a blank line.
        additional_document_ref:
          type: string
          description: Cross-referenced document (e.g. order number for LLM sources)
        document_summary:
          type: string
          description: One-sentence description of the document (LLM-generated for llm-* sources)
        accounting_supplier_party:
          $ref: '#/components/schemas/BusinessParty'
        accounting_customer_party:
          $ref: '#/components/schemas/BusinessParty'
        business_document_lines:
          type: array
          items:
            $ref: '#/components/schemas/BusinessDocumentLine'
        legal_monetary_total:
          $ref: '#/components/schemas/MonetaryTotal'
        payment_terms:
          type: string
          description: |
            Free-text payment terms. When the source document is marked as
            paid (LLM sources only), the deterministic token "[PAID]" is
            appended — importers can test for that exact suffix.
        payment_means_code:
          type: string
          description: Payment means code or method label (e.g. "bank transfer")
        payment_means:
          type: array
          items:
            $ref: '#/components/schemas/BusinessPaymentMeans'

    BusinessParty:
      type: object
      description: A trading partner (seller or buyer).
      properties:
        name:
          type: string
        street_name:
          type: string
        postal_zone:
          type: string
        city_name:
          type: string
        country_code:
          type: string
          description: ISO 3166-1 alpha-2 country code (e.g. "DE")
        vat_id:
          type: string
          description: VAT registration number (e.g. "DE123456789")
        tax_registration_id:
          type: string
          description: Local tax number (Steuernummer)
        company_registration_id:
          type: string
          description: Commercial register number (e.g. "HRB 12345")
        electronic_mail:
          type: string
        telephone:
          type: string

    BusinessDocumentLine:
      type: object
      description: A single line item. Decimal values are JSON strings.
      properties:
        id:
          type: string
          description: Line identifier / position number
        item_name:
          type: string
          description: Short article or service name
        description:
          type: string
          description: Longer explanatory line text
        invoiced_quantity:
          type: string
          description: Decimal string
        unit_code:
          type: string
          description: Unit of measure (UN/ECE Rec 20 code for xml-* sources)
        standard_item_identification:
          type: string
          description: Standardised item ID (e.g. GTIN); xml-* sources only
        sellers_item_identification:
          type: string
          description: Seller-assigned article number
        buyers_item_identification:
          type: string
        order_line_reference:
          type: string
        project_reference_line:
          type: string
        price:
          $ref: '#/components/schemas/BusinessPrice'
        allowance_charge_amount:
          type: string
          description: Absolute line discount/charge; decimal string
        line_extension_amount:
          type: string
          description: Line net amount; decimal string
        total_amount:
          type: string
          description: Line gross amount; decimal string
        classified_tax_category:
          $ref: '#/components/schemas/BusinessTaxCategory'
        vat_amount:
          type: string
          description: Decimal string

    BusinessPrice:
      type: object
      description: Unit price information. Decimal values are JSON strings.
      properties:
        item_net_price:
          type: string
          description: Decimal string
        base_quantity:
          type: string
          description: Decimal string; "0" for llm-* sources (not derived)
        base_quantity_unit_code:
          type: string

    BusinessTaxCategory:
      type: object
      description: VAT category applied to a line or totals row.
      properties:
        id:
          type: string
          description: |
            EN 16931 category code (S=Standard, Z=Zero, E=Exempt,
            AE=Reverse charge). For llm-* sources only set when the document
            explicitly states the tax treatment — never inferred from the rate.
        percent:
          type: string
          description: Tax rate percentage as decimal string (e.g. "19")
        tax_scheme_id:
          type: string
          description: Tax scheme, default "VAT"

    MonetaryTotal:
      type: object
      description: |
        Document-level monetary summary. Decimal values are JSON strings.
        For llm-* sources only simple arithmetic is applied
        (tax_exclusive_amount = net − discount); prepaid_amount is never
        derived and stays "0".
      properties:
        line_extension_amount:
          type: string
        allowance_total_amount:
          type: string
        tax_exclusive_amount:
          type: string
        tax_inclusive_amount:
          type: string
        prepaid_amount:
          type: string
        payable_amount:
          type: string
        document_currency_code:
          type: string
          description: ISO 4217 currency code (e.g. "EUR")
        tax_subtotal:
          type: array
          items:
            $ref: '#/components/schemas/TaxSubtotal'

    TaxSubtotal:
      type: object
      description: |
        One row of the document-level VAT breakdown. For llm-* sources the
        buckets are copied from the extraction without back-calculation:
        taxable_amount stays "0" and tax_category_id stays empty unless
        stated on the document.
      properties:
        tax_category_id:
          type: string
        tax_category_percent:
          type: string
        tax_scheme_id:
          type: string
        taxable_amount:
          type: string
        tax_amount:
          type: string

    BusinessPaymentMeans:
      type: object
      description: One payment channel of the supplier.
      properties:
        payee_financial_account:
          type: string
          description: IBAN
        bic_id:
          type: string
        financial_institution_name:
          type: string

    AddressCreate:
      type: object
      required: [name]
      properties:
        mailbox_id:
          type: string
          format: uuid
          nullable: true
          description: |
            When set, creates a mailbox-specific address override.
            When omitted or null, creates the global tenant address.
        name:
          type: string
          description: Legal entity name
        street:
          type: string
        postal_code:
          type: string
        city:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code (e.g. "DE")
        vat_id:
          type: string
          description: VAT identification number
        email:
          type: string
          format: email
        phone:
          type: string

    AddressUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        street:
          type: string
        postal_code:
          type: string
        city:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code (e.g. "DE")
        vat_id:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    AddressResponse:
      type: object
      required: [id, tenant_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
          nullable: true
          description: Null for global tenant address; set for mailbox-specific override.
        name:
          type: string
        street:
          type: string
        postal_code:
          type: string
        city:
          type: string
        country:
          type: string
        vat_id:
          type: string
        email:
          type: string
        phone:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PagedAddressResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AddressResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    MailboxCredentialType:
      type: string
      enum: [imap, outlook, gmail]
      description: |
        Identifies the ingestor type for a mailbox credential.
        - `imap`: credentials JSON contains host, port, ssl, tls, username, password
        - `outlook`: credentials JSON contains azure_tenant_id, client_id, client_secret
        - `gmail`: credentials JSON contains service_account_json

    MailboxCredentialCreate:
      type: object
      required: [type, name, credentials]
      properties:
        type:
          $ref: '#/components/schemas/MailboxCredentialType'
        name:
          type: string
          description: Human-readable label for this credential set
        credentials:
          type: object
          writeOnly: true
          description: |
            Type-specific credential object — accepted on write, encrypted at rest, never returned.
            imap: { host, port, ssl, tls, username, password }
            outlook: { azure_tenant_id, client_id, client_secret }
            gmail: { service_account_json }

    MailboxCredentialUpdate:
      type: object
      properties:
        name:
          type: string
        credentials:
          type: object
          writeOnly: true
          description: Replace the stored credentials — encrypted at rest, never returned.

    MailboxCredentialResponse:
      type: object
      required: [id, tenant_id, type, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/MailboxCredentialType'
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PagedMailboxCredentialResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MailboxCredentialResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Actions ──────────────────────────────────────────────────────────────────

    ActionType:
      type: string
      enum: [webhook]
      description: Identifies the postprocessing adapter. Only `webhook` is supported today.

    AuthMethod:
      type: string
      enum: ["", bearer, jwt, api_key_header, basic]
      description: |
        How the webhook call authenticates. Admin-selected — never auto-detected.
        - `bearer`, `jwt`: auth_credentials = { token }, sent as `Authorization: Bearer <token>`.
        - `api_key_header`: auth_credentials = { header_name, value }, sent as a custom header.
        - `basic`: auth_credentials = { username, password }, sent as HTTP Basic auth.
        - `""` (empty): no authentication. On ActionUpdate, sending auth_method: ""
          explicitly clears any existing credentials; omitting auth_method
          entirely leaves existing credentials unchanged.

    ActionCreate:
      type: object
      required: [type, url]
      properties:
        type:
          $ref: '#/components/schemas/ActionType'
        url:
          type: string
          description: The webhook URL to be called.
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
        auth_credentials:
          type: object
          writeOnly: true
          description: |
            Method-specific credential object — accepted on write, encrypted at
            rest, never returned. Required when auth_method is set; omit both
            fields for no authentication. Schema depends on auth_method (see
            AuthMethod).
        active:
          type: boolean
          default: false
          description: |
            Always rejected as true on create (400) — a newly created action
            has never been validated. Activate via ActionUpdate after a
            successful POST .../validate.

    ActionUpdate:
      type: object
      description: |
        All fields are optional; only provided fields are changed. To change
        or clear authentication, send both auth_method and auth_credentials
        together (send auth_method: null with no auth_credentials to clear).
      properties:
        url:
          type: string
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
        auth_credentials:
          type: object
          writeOnly: true
          description: Replace the stored credentials — encrypted at rest, never returned.
        active:
          type: boolean
          description: |
            Sending true is rejected (400) unless the action is currently
            validated. Changing url/auth_method/auth_credentials in the same
            request resets validated to false first, so true together with
            any of those in one request is always rejected — validate again
            after the configuration change lands.

    ActionResponse:
      type: object
      required: [id, tenant_id, type, url, active, validated, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ActionType'
        url:
          type: string
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
        active:
          type: boolean
        validated:
          type: boolean
          description: |
            Server-controlled. True once POST .../validate has succeeded for
            the current url/auth_method/auth_credentials; reset to false by
            any change to those fields.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ActionValidateResponse:
      type: object
      required: [step, success, reason]
      properties:
        step:
          type: string
          enum: [formal_validation, live_test]
          description: Which of the two steps this result is for.
        success:
          type: boolean
        status_code:
          type: integer
          nullable: true
          description: HTTP status code returned by the live test call. Null for the formal_validation step.
        reason:
          type: string
          description: Human-readable failure reason; empty on success.

    PagedActionResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ActionMailboxLink:
      type: object
      required: [mailbox_id]
      properties:
        mailbox_id:
          type: string
          format: uuid

    ActionMailboxList:
      type: object
      required: [mailbox_ids]
      properties:
        mailbox_ids:
          type: array
          items:
            type: string
            format: uuid

    # ── Roles ────────────────────────────────────────────────────────────────────

    Role:
      type: string
      enum: [email-bridge, global_tenant_admin, tenant_admin, mailbox_user]
      description: |
        System-managed authorization role. `email-bridge` is the mandatory
        IdP login gate, granted/revoked directly in Zitadel rather than
        stored locally; every other role is a local grant.

    RoleGrant:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        tenant_id:
          type: string
          format: uuid
          nullable: true
          description: Required for every role — the assignee's own home tenant.
        mailbox_id:
          type: string
          format: uuid
          nullable: true
          description: Required only for mailbox_user.

    # ── Users ────────────────────────────────────────────────────────────────────

    UserCreate:
      type: object
      required: [email, given_name, family_name]
      properties:
        email:
          type: string
          format: email
        given_name:
          type: string
        family_name:
          type: string
        grants:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
          description: Initial role grants beyond the automatic email-bridge grant.

    UserUpdate:
      type: object
      description: All fields are optional; only provided fields are changed.
      properties:
        given_name:
          type: string
        family_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        active:
          type: boolean
          description: |
            Setting to false deactivates the user (Zitadel + email-bridge
            revoke + local flag); setting to true reverses it. See
            /tenants/{tenantId}/users/{userId} PUT.

    UserResponse:
      type: object
      required: [id, tenant_id, email, active, given_name, family_name, is_tenant_admin]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
        active:
          type: boolean
          description: Local active flag.
        given_name:
          type: string
        family_name:
          type: string
        is_tenant_admin:
          type: boolean
        mailbox_ids:
          type: array
          items:
            type: string
            format: uuid
        username:
          type: string
          description: Zitadel username.
        email_verified:
          type: boolean
        phone:
          type: string
        phone_verified:
          type: boolean
        state:
          type: string
          enum: [unspecified, active, inactive, deleted, locked, initial]
          description: Zitadel-side user state.

    PagedUserResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── ServiceAccounts ──────────────────────────────────────────────────────────

    AccessTokenType:
      type: string
      enum: [bearer, jwt]
      description: |
        Format of tokens the service account's own PAT/session obtains.
        Unrelated to how the account authenticates to Zitadel (always a
        JWT-profile key). A bearer-typed account cannot authenticate to this
        app's own API — only jwt-typed accounts can.

    ServiceAccountCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        grants:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
          description: Initial role grants beyond the automatic email-bridge grant.
        public_key_pem:
          type: string
          description: |
            Caller-supplied RSA public key (PEM). Preferred — the private key
            never transits this app. Omit to have Zitadel generate a keypair.
        expires_at:
          type: string
          format: date-time
          description: Initial machine key expiration. Omit for the server default.

    ServiceAccountCreateResponse:
      type: object
      required: [user_id, key_id]
      properties:
        user_id:
          type: string
          format: uuid
        key_id:
          type: string
        key:
          type: string
          format: byte
          description: |
            One-time JWT-profile private-key material, exactly as Zitadel
            returned it. Empty when public_key_pem was supplied. Never
            returned again after this call and never persisted server-side.

    ServiceAccountUpdate:
      type: object
      description: All fields are optional; only provided fields are changed.
      properties:
        name:
          type: string
        description:
          type: string
        access_token_type:
          $ref: '#/components/schemas/AccessTokenType'
        is_tenant_admin:
          type: boolean
        mailbox_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Full desired set of mailbox_user grants — replaces the existing set.

    ServiceAccountResponse:
      type: object
      required: [user_id, tenant_id, name]
      properties:
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        access_token_type:
          $ref: '#/components/schemas/AccessTokenType'
        is_tenant_admin:
          type: boolean
        mailbox_ids:
          type: array
          items:
            type: string
            format: uuid

    PagedServiceAccountResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceAccountResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ServiceAccountKeyCreate:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
          description: Omit for the server default (10 years).

    ServiceAccountKeyResponse:
      type: object
      required: [key_id]
      properties:
        key_id:
          type: string
        key:
          type: string
          format: byte
          description: One-time private-key material. Never returned again; never persisted server-side.

    PersonalAccessTokenCreate:
      type: object
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time

    PersonalAccessTokenCreateResponse:
      type: object
      required: [token_id, token]
      properties:
        token_id:
          type: string
        token:
          type: string
          description: One-time plain-text credential. Never returned again; never persisted server-side.

    PersonalAccessTokenResponse:
      type: object
      required: [id, expires_at, created_at]
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PagedPersonalAccessTokenResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PersonalAccessTokenResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    # ── IdentityProviders ────────────────────────────────────────────────────────

    IdpProviderCreate:
      type: object
      required: [name, client_id, client_secret, issuer]
      properties:
        name:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
          writeOnly: true
        issuer:
          type: string
        scopes:
          type: array
          items:
            type: string
        auto_register:
          type: boolean
          default: false

    IdpProviderResponse:
      type: object
      required: [id, name, is_active]
      properties:
        id:
          type: string
        name:
          type: string
        is_active:
          type: boolean

    PagedIdpProviderResponse:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdpProviderResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
